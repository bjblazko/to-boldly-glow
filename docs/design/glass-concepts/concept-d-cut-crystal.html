<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept D: Cut Crystal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=block">
<link rel="stylesheet" href="layout.css">
<style>
  :root {
    --sapphire: #3d7bff; --amethyst: #a855ff; --ruby: #ff2e74; --citrine: #ffc53d; --emerald: #1fe0a5;
    --text: #f4f5ff; --dim: rgba(226, 230, 255, 0.62);
    /* Cut edges are drawn with inset shadows: per-side border colours break with corner-shape. */
    --edge: rgba(255, 255, 255, 0.26);
    --raised: inset 0 1.5px 0 rgba(255,255,255,.62), inset 1.5px 0 0 rgba(255,255,255,.34), inset 0 -1.5px 0 rgba(0,0,0,.45), inset -1.5px 0 0 rgba(0,0,0,.22);
    --sunk: inset 0 2px 0 rgba(0,0,0,.55), inset 2px 0 0 rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.3), inset -1px 0 0 rgba(255,255,255,.16);
    --serif: 'Cormorant Garamond', Georgia, serif;
  }
  body { font-family: 'Jost', 'Inter', sans-serif; color: var(--text); }
  .icon { stroke-width: 1.5; }

  .wash {
    background:
      radial-gradient(600px 460px at 4% 36%, rgba(61, 123, 255, 0.5), transparent 70%),
      radial-gradient(620px 480px at 98% 26%, rgba(168, 85, 255, 0.5), transparent 70%),
      radial-gradient(860px 300px at 50% 108%, rgba(255, 46, 116, 0.34), transparent 70%),
      radial-gradient(380px 300px at 72% 80%, rgba(255, 197, 61, 0.16), transparent 70%);
    mix-blend-mode: screen;
  }

  /* Caption */
  .caption-kicker { font-size: 11px; font-weight: 500; letter-spacing: 0.42em; color: var(--dim); }
  .caption-title { margin-top: 4px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 58px; line-height: 1;
    background: linear-gradient(100deg, #fff 0 30%, #bcd3ff 44%, #f3c7ff 58%, #fff 72%);
    -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 0 20px rgba(150, 170, 255, 0.35)); }
  .caption-sub { margin-top: 8px; font-size: 15px; font-weight: 300; letter-spacing: 0.04em; color: var(--dim); }
  .swatches { gap: 14px; margin-top: 16px; padding-left: 4px; }
  .swatches i { width: 15px; height: 15px; border-radius: 0; transform: rotate(45deg);
    background: linear-gradient(135deg, rgba(255,255,255,.75) 0 22%, var(--c) 22% 60%, color-mix(in oklab, var(--c), #000 35%) 60%);
    box-shadow: 0 0 12px var(--c), inset 0 0 0 1px rgba(255,255,255,.35); }

  /* Cut-glass surface: chamfered corners, bevelled edge, facet planes */
  .panel, .dock {
    border-radius: 18px; corner-shape: bevel;
    background:
      linear-gradient(116deg, rgba(255,255,255,.15) 0 17%, rgba(255,255,255,.05) 17% 53%, rgba(255,255,255,.1) 53% 76%, rgba(255,255,255,.035) 76%),
      linear-gradient(180deg, rgba(18, 22, 58, 0.34), rgba(8, 8, 26, 0.5));
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 1px 0 0 rgba(255, 255, 255, 0.3),
      inset 4px 4px 0 rgba(255, 255, 255, 0.07),
      inset -4px -4px 0 rgba(0, 0, 0, 0.22),
      0 34px 70px -24px rgba(0, 0, 0, 0.85),
      0 20px 80px -34px var(--gem, var(--sapphire));
  }
  /* inner ground line, parallel to the outer edge */
  .panel::before, .dock::before {
    content: ''; position: absolute; inset: 4px; pointer-events: none;
    border-radius: 15.5px; corner-shape: bevel;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  /* prismatic glint running along the top edge */
  .panel::after, .dock::after {
    content: ''; position: absolute; top: -1px; left: 24px; width: 46%; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, #fff 18%, #9fe9ff 40%, #ff9de3 62%, #ffe39a 78%, transparent);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }
  .camera { --gem: var(--sapphire); }
  .display { --gem: var(--emerald); }
  .lesson { --gem: var(--ruby); }

  .panel-head { padding: 18px 18px 10px 20px; }
  .panel-title { font-family: var(--serif); font-style: italic; font-size: 27px; font-weight: 600; letter-spacing: 0.01em; gap: 12px; }
  .panel-title .icon { width: 20px; height: 20px; color: var(--gem); filter: drop-shadow(0 0 6px var(--gem)); }

  /* Move handle: knurled, diamond-cut plate */
  .grip { display: block; width: 30px; height: 20px; border-radius: 4px; corner-shape: bevel;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.42) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.42) 0 1px, transparent 1px 4px),
      rgba(255,255,255,.04);
    border: 1px solid var(--edge); box-shadow: var(--raised); }
  .grip span { display: none; }
  .grip-top { width: 72px; height: 12px; top: 10px; }

  /* Close: chamfered crystal key */
  .close { width: 32px; height: 32px; border-radius: 8px; corner-shape: bevel; color: #fff;
    background: linear-gradient(135deg, rgba(255,255,255,.2) 0 45%, rgba(255,255,255,.06) 45%);
    border: 1px solid var(--edge); box-shadow: var(--raised); }
  .close .icon { width: 13px; height: 13px; stroke-width: 1.6; }
  .lesson-close { top: 16px; right: 16px; }

  /* Buttons: table-cut gems with a bevelled rim */
  .btn { position: relative; height: 50px; border-radius: 10px; corner-shape: bevel; border: 1px solid;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .btn .icon { width: 16px; height: 16px; }
  .btn-primary { color: #fff; text-shadow: 0 1px 1px rgba(0, 20, 90, 0.5);
    border-color: #1c3a9c;
    background:
      linear-gradient(112deg, rgba(255,255,255,.26) 0 22%, rgba(255,255,255,0) 22% 64%, rgba(255,255,255,.1) 64% 80%, rgba(0,0,0,.08) 80%),
      linear-gradient(180deg, #5b8fff, #2e62ec);
    box-shadow: inset 0 3px 0 #a9c6ff, inset 3px 0 0 #6e9bff, inset 0 -3px 0 #1f43b8, inset -3px 0 0 #3463e6,
      0 14px 32px -12px rgba(61, 123, 255, 0.95), 0 0 36px -8px rgba(61, 123, 255, 0.55); }
  .btn-secondary { color: #fff; border-color: var(--edge);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 3px 0 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.35), inset -3px 0 0 rgba(0,0,0,.15);
    background: linear-gradient(112deg, rgba(255,255,255,.16) 0 22%, rgba(255,255,255,.05) 22% 64%, rgba(255,255,255,.1) 64%); }
  .btn-secondary .icon { color: var(--citrine); fill: var(--citrine); filter: drop-shadow(0 0 5px var(--citrine)); }

  /* Text field: engraved slot */
  .field { height: 48px; border-radius: 8px; corner-shape: bevel; border: 1px solid rgba(255,255,255,.14); box-shadow: var(--sunk);
    background: rgba(4, 6, 24, 0.45); font-size: 16px; font-weight: 400; letter-spacing: 0.02em; }
  .field.is-focused { border-color: #9dbcff; box-shadow: var(--sunk), 0 0 22px rgba(61, 123, 255, 0.55); }
  .field > .icon { color: var(--dim); }
  .caret { width: 1.5px; background: #b8cdff; box-shadow: 0 0 6px var(--sapphire); }
  .field-ghost { color: rgba(255, 255, 255, 0.34); }
  .field-count { border-radius: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--citrine); background: none;
    border: 1px solid rgba(255, 197, 61, 0.55); }

  .results li { position: relative; height: 40px; border-radius: 6px; corner-shape: bevel; font-size: 15.5px; padding-left: 30px; }
  .results li::before { content: ''; position: absolute; left: 12px; top: 50%; width: 6px; height: 6px; margin-top: -3px; transform: rotate(45deg);
    background: rgba(255, 255, 255, 0.25); }
  .results li.is-active { background: linear-gradient(90deg, rgba(61, 123, 255, 0.34), rgba(61, 123, 255, 0.06));
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.25); }
  .results li.is-active::before { background: var(--citrine); box-shadow: 0 0 8px var(--citrine); }
  .results em { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }

  .chip { height: 38px; border-radius: 8px; corner-shape: bevel; font-size: 14px; font-weight: 400; letter-spacing: 0.02em;
    border: 1px solid var(--edge); box-shadow: var(--raised); background: rgba(255, 255, 255, 0.06); }
  .chip-dot { width: 8px; height: 8px; border-radius: 0; transform: rotate(45deg); background: var(--ruby); box-shadow: 0 0 10px var(--ruby); }
  .chip b { font-family: var(--serif); font-style: italic; font-size: 17px; font-weight: 600; }
  .chip-close { width: 26px; height: 26px; border-radius: 6px; }

  /* Segmented: engraved track, amethyst gem selection */
  .segmented { height: 46px; padding: 4px; border-radius: 9px; corner-shape: bevel; border: 1px solid rgba(255,255,255,.14); box-shadow: var(--sunk);
    background: rgba(4, 6, 24, 0.45); }
  .segmented button { border-radius: 6px; corner-shape: bevel; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
  .segmented .is-on { color: #fff; border: 1px solid #4a1690;
    background: linear-gradient(112deg, rgba(255,255,255,.24) 0 26%, rgba(255,255,255,0) 26% 70%, rgba(0,0,0,.1) 70%), linear-gradient(180deg, #b874ff, #8b3ff0);
    box-shadow: inset 0 2px 0 #e3b8ff, inset 2px 0 0 #c487ff, inset 0 -2px 0 #5d1fa8, inset -2px 0 0 #8f3fe0, 0 0 22px -2px rgba(168, 85, 255, 0.75); }

  /* Toggle switches: engraved slot with a crystal block */
  .switch-label { font-family: var(--serif); font-size: 21px; font-weight: 600; font-style: italic; }
  .switch-hint { font-size: 12px; font-weight: 300; letter-spacing: 0.03em; color: var(--dim); }
  .switch { width: 60px; height: 30px; border-radius: 7px; corner-shape: bevel; border: 1px solid rgba(255,255,255,.14); box-shadow: var(--sunk); background: rgba(4, 6, 24, 0.5); }
  .switch i { top: 3px; left: 3px; width: 24px; height: 22px; border-radius: 4px; corner-shape: bevel; border: 1px solid rgba(40,44,70,.6);
    background: linear-gradient(135deg, #ffffff 0 34%, #d9def2 34% 66%, #b8bfd9 66%); box-shadow: var(--raised), 0 2px 5px rgba(0,0,0,.5); }
  .switch.is-on { border-color: #0a6e50;
    background: linear-gradient(112deg, rgba(255,255,255,.25) 0 30%, rgba(255,255,255,0) 30%), linear-gradient(180deg, #2ef0b4, #0fb884);
    box-shadow: inset 0 2px 0 rgba(0,60,40,.5), inset 0 -1px 0 #a6ffe3, 0 0 22px rgba(31, 224, 165, 0.6); }
  .switch.is-on i { left: 31px; }

  /* Checkboxes: gem-cut squares in jewel tones */
  .check { height: 46px; border-radius: 8px; corner-shape: bevel; font-size: 14.5px; font-weight: 400; letter-spacing: 0.02em;
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); }
  .box { width: 20px; height: 20px; border-radius: 4px; corner-shape: bevel; border: 1px solid rgba(255,255,255,.18); box-shadow: var(--sunk); background: rgba(4, 6, 24, 0.5); }
  .check:nth-child(4n+1) { --g: var(--sapphire); }
  .check:nth-child(4n+2) { --g: var(--ruby); }
  .check:nth-child(4n+3) { --g: var(--amethyst); }
  .check:nth-child(4n+4) { --g: var(--citrine); }
  .check.is-on .box { border: 1px solid rgba(255, 255, 255, 0.6);
    background: linear-gradient(135deg, color-mix(in oklab, var(--g), #fff 45%) 0 30%, var(--g) 30% 62%, color-mix(in oklab, var(--g), #000 30%) 62%);
    box-shadow: 0 0 14px var(--g); }
  .box .icon { width: 14px; height: 14px; color: #fff; stroke-width: 2.4; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

  /* Lesson */
  .lesson-kicker { font-size: 11px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: var(--citrine); }
  .lesson-kicker b { margin-left: 8px; font-family: var(--serif); font-style: italic; font-size: 17px; font-weight: 600; letter-spacing: 0.04em; text-transform: none; color: #fff; }
  .lesson-title { margin: 4px 0 6px; font-family: var(--serif); font-style: italic; font-size: 40px; font-weight: 600; line-height: 1.05; }
  .lesson-text { font-size: 15.5px; font-weight: 300; line-height: 1.6; letter-spacing: 0.01em; color: rgba(236, 238, 255, 0.88); }
  .round { width: 42px; height: 42px; border-radius: 9px; corner-shape: bevel; color: #fff; border: 1px solid var(--edge); box-shadow: var(--raised);
    background: linear-gradient(135deg, rgba(255,255,255,.18) 0 45%, rgba(255,255,255,.05) 45%); }
  .round-next { border-color: #8a0a35;
    background: linear-gradient(112deg, rgba(255,255,255,.26) 0 28%, rgba(255,255,255,0) 28% 68%, rgba(0,0,0,.1) 68%), linear-gradient(180deg, #ff5a92, #e8195c);
    box-shadow: inset 0 3px 0 #ffb0c9, inset 3px 0 0 #ff6f9b, inset 0 -3px 0 #a30c3e, inset -3px 0 0 #e0175a, 0 0 26px -4px rgba(255, 46, 116, 0.85); }
  .round .icon { width: 18px; height: 18px; stroke-width: 1.8; }
  .progress { gap: 10px; }
  .progress i { width: 7px; height: 7px; border-radius: 0; transform: rotate(45deg); background: none; border: 1px solid rgba(255,255,255,.4); }
  .progress i.done { background: var(--citrine); border-color: var(--citrine); }
  .progress i.now { width: 10px; height: 10px; background: var(--ruby); border-color: #ffb0c9; box-shadow: 0 0 10px var(--ruby); }
  .lesson-note { font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); }

  /* Dock */
  .dock { --gem: var(--emerald); border-radius: 20px; padding: 9px; gap: 6px; }
  .dock::before { border-radius: 17.5px; }
  .dock-btn { position: relative; border-radius: 10px; corner-shape: bevel; font-size: 10.5px; font-weight: 500; letter-spacing: 0.24em;
    text-transform: uppercase; color: rgba(236, 238, 255, 0.74); gap: 6px; }
  .dock-btn[data-accent='camera'] .icon { color: #9dbcff; }
  .dock-btn[data-accent='time'] .icon { color: #ffd77a; }
  .dock-btn[data-accent='learn'] .icon { color: #ff8db4; }
  .dock-btn.is-active { color: #fff; border: 1px solid #075c41; text-shadow: 0 1px 1px rgba(0,60,40,.5);
    background: linear-gradient(112deg, rgba(255,255,255,.26) 0 26%, rgba(255,255,255,0) 26% 66%, rgba(0,0,0,.1) 66%), linear-gradient(180deg, #2ef0b4, #0eae7e);
    box-shadow: inset 0 3px 0 #b5ffe8, inset 3px 0 0 #63f5c6, inset 0 -3px 0 #0b875f, inset -3px 0 0 #19c08d, 0 0 30px -4px rgba(31, 224, 165, 0.8); }
</style>
</head>
<body>
<script>
  window.CONCEPT = {
    kicker: 'CONCEPT D',
    name: 'Cut Crystal',
    tagline: 'Faceted crystal with ground edges and jewel-cut controls',
    chapter: 'iii of vii',
    swatches: ['#3d7bff', '#a855ff', '#ff2e74', '#ffc53d', '#1fe0a5'],
    starTints: ['#ffffff', '#dbe6ff', '#f1ddff'],
    seed: 41,
  };
</script>
<script src="scene.js"></script>
</body>
</html>
