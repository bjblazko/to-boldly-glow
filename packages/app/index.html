<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To Boldly Glow</title>
    <link rel="stylesheet" href="/src/hud/hud.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* the canvas fills the viewport; no page scrollbars needed */
      }
      #scene-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #scene {
        display: block; /* canvas is inline by default, which leaves a few px of gap below it */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="scene-wrapper">
      <canvas id="scene"></canvas>
      <div id="body-labels" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;"></div>
      <div id="location-a-label" class="body-label" style="display: none;">Location A</div>
      <div id="location-b-label" class="body-label" style="display: none;">Location B</div>
      <div id="axis-tilt-label" class="body-label" style="display: none;"></div>
      <div id="axis-line-label" class="body-label" style="display: none;">Rotation Axis</div>
      <div id="equator-line-label" class="body-label" style="display: none;">Equator</div>
      <div id="reference-line-label" class="body-label" style="display: none;">Reference (⊥ to Sun)</div>
      <div id="toward-sun-label" class="body-label" style="display: none;">Toward the Sun</div>
    </div>

    <!-- Monochrome line-icon set, referenced elsewhere via <svg class="icon"><use href="#icon-name"/></svg> -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-camera" viewBox="0 0 24 24">
        <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z" />
        <circle cx="12" cy="13" r="3.4" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.25" />
        <path d="M12 7.5V12l3.2 2" />
      </symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24">
        <path d="M12 3.5 21 8.5 12 13.5 3 8.5 12 3.5Z" />
        <path d="M3 12.5 12 17.5 21 12.5" />
        <path d="M3 16.5 12 21.5 21 16.5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6" />
        <path d="M15.2 15.2 20 20" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l11-6.5-11-6.5Z" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M9 6v12M15 6v12" />
      </symbol>
      <symbol id="icon-reverse" viewBox="0 0 24 24">
        <path d="M4 9.5h13.5M13.5 5.5l4 4-4 4" />
        <path d="M20 14.5H6.5M10.5 18.5l-4-4 4-4" />
      </symbol>
      <symbol id="icon-rewind" viewBox="0 0 24 24">
        <path d="M13 6l-6 6 6 6M19 6l-6 6 6 6" />
      </symbol>
      <symbol id="icon-forward" viewBox="0 0 24 24">
        <path d="M11 6l6 6-6 6M5 6l6 6-6 6" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7" />
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M4 5.5c0-1 .8-1.5 2-1.5h5.5v15H6c-1.2 0-2 .5-2 1.5v-15Z" />
        <path d="M20 5.5c0-1-.8-1.5-2-1.5h-5.5v15H18c1.2 0 2 .5 2 1.5v-15Z" />
      </symbol>
    </svg>

    <div class="hud-sheet" id="hud-sheet">
      <div class="hud-sheet-panel" data-panel="camera">
        <button id="camera-mode-toggle" class="hud-btn hud-btn-primary" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-camera"></use></svg>
          <span class="btn-label">Switch to Free-fly Camera</span>
        </button>
        <div class="hud-search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <input id="entity-search-input" type="text" placeholder="Search bodies…" />
        </div>
        <div id="entity-search-results"></div>
        <div id="follow-indicator" class="hud-chip">
          <span id="follow-indicator-label"></span>
          <button id="follow-stop-button" class="hud-chip-close" type="button" aria-label="Stop following">
            <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
      </div>

      <div class="hud-sheet-panel" data-panel="time">
        <div class="hud-row">
          <button id="time-play-pause" class="hud-icon-btn" type="button">
            <svg class="icon icon-pause-glyph" aria-hidden="true"><use href="#icon-pause"></use></svg>
            <svg class="icon icon-play-glyph" aria-hidden="true"><use href="#icon-play"></use></svg>
            <span class="btn-label">Pause</span>
          </button>
          <button id="time-reverse" class="hud-icon-btn" type="button" aria-label="Reverse direction">
            <svg class="icon" aria-hidden="true"><use href="#icon-reverse"></use></svg>
          </button>
          <select id="time-preset-select" class="hud-select"></select>
        </div>

        <div>
          <div class="hud-shuttle">
            <svg class="icon hud-shuttle-end" aria-hidden="true"><use href="#icon-rewind"></use></svg>
            <div class="hud-shuttle-track-wrap">
              <div class="hud-shuttle-track">
                <div class="hud-shuttle-fill" id="time-shuttle-fill"></div>
                <div class="hud-shuttle-center"></div>
              </div>
              <input
                id="time-shuttle"
                class="hud-range hud-shuttle-input"
                type="range"
                min="-100"
                max="100"
                value="0"
                aria-label="Time rate — negative rewinds, positive fast-forwards, center is stopped"
              />
            </div>
            <svg class="icon hud-shuttle-end" aria-hidden="true"><use href="#icon-forward"></use></svg>
          </div>
          <div class="hud-shuttle-labels" aria-hidden="true">
            <span>Past</span>
            <span class="hud-shuttle-now">Now</span>
            <span>Future</span>
          </div>
        </div>

        <div class="hud-row-between">
          <span>Realistic</span>
          <label class="hud-toggle-chip">
            <input id="scale-toggle" type="checkbox" checked aria-label="Scale mode: Realistic or Compact" />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
            </span>
          </label>
          <span>Compact</span>
        </div>

        <div id="time-display" class="hud-readout">—</div>
      </div>

      <div class="hud-sheet-panel" data-panel="display">
        <div class="hud-toggle-grid">
          <label class="hud-toggle-chip">
            <input id="orbit-paths-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Orbit paths
            </span>
          </label>
          <label class="hud-toggle-chip">
            <input id="body-labels-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Labels
            </span>
          </label>
          <label class="hud-toggle-chip">
            <input id="starfield-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Stars
            </span>
          </label>
          <label class="hud-toggle-chip">
            <input id="bloom-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Bloom
            </span>
          </label>
          <label class="hud-toggle-chip">
            <input id="flares-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Lens flares
            </span>
          </label>
          <label class="hud-toggle-chip">
            <input id="moons-toggle" type="checkbox" checked />
            <span class="hud-toggle-visual">
              <svg class="icon icon-check" aria-hidden="true"><use href="#icon-check"></use></svg>
              Moons
            </span>
          </label>
        </div>
      </div>
    </div>

    <nav class="hud-dock" aria-label="Controls">
      <button class="hud-dock-btn" data-panel="camera" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-camera"></use></svg>
        <span class="hud-dock-label">Camera</span>
      </button>
      <button class="hud-dock-btn" data-panel="time" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg>
        <span class="hud-dock-label">Time</span>
      </button>
    </nav>

    <div class="hud-corner-controls">
      <button id="display-corner-btn" class="hud-corner-btn hud-dock-btn" data-panel="display" type="button" aria-label="Display options">
        <svg class="icon" aria-hidden="true"><use href="#icon-layers"></use></svg>
      </button>
      <button id="learn-mode-btn" class="hud-corner-btn hud-corner-btn-learn" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-book"></use></svg>
        <span id="learn-mode-btn-label">Learn</span>
      </button>
    </div>

    <div id="lesson-picker" class="hud-lesson-picker" hidden>
      <button class="hud-lesson-picker-item" data-lesson-id="seasons" type="button">
        Why does Earth have seasons?
      </button>
    </div>

    <div id="lesson-panel" class="hud-lesson-panel" hidden>
      <div id="lesson-panel-grip" class="hud-lesson-panel-grip" aria-hidden="true">
        <span class="hud-lesson-panel-grip-bar"></span>
      </div>
      <div class="hud-row-between">
        <button id="lesson-prev-chapter" class="hud-icon-btn" type="button" aria-label="Previous chapter">
          <svg class="icon" aria-hidden="true"><use href="#icon-rewind"></use></svg>
        </button>
        <button id="lesson-next-chapter" class="hud-icon-btn" type="button" aria-label="Next chapter">
          <svg class="icon" aria-hidden="true"><use href="#icon-forward"></use></svg>
        </button>
        <span id="lesson-chapter-title"></span>
      </div>

      <p id="lesson-chapter-text" class="hud-lesson-text"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
