<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To Boldly Glow</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* the canvas fills the viewport; no page scrollbars needed */
      }
      #scene-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #scene {
        display: block; /* canvas is inline by default, which leaves a few px of gap below it */
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="scene-wrapper">
      <canvas id="scene"></canvas>
      <div id="body-labels" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;"></div>
    </div>
    <button
      id="camera-mode-toggle"
      style="position: fixed; top: 12px; left: 12px; padding: 8px 12px; font: 14px sans-serif;"
    >
      Switch to Free-fly Camera
    </button>
    <div
      id="entity-search"
      style="position: fixed; top: 56px; left: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; width: 200px;"
    >
      <input
        id="entity-search-input"
        type="text"
        placeholder="Search bodies…"
        style="width: 100%; box-sizing: border-box;"
      />
      <div id="entity-search-results" style="max-height: 160px; overflow-y: auto;"></div>
    </div>
    <div
      id="follow-indicator"
      style="position: fixed; top: 12px; left: 224px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: none; align-items: center; gap: 8px;"
    >
      <span id="follow-indicator-label"></span>
      <button id="follow-stop-button">×</button>
    </div>
    <div
      id="time-controls"
      style="position: fixed; bottom: 12px; left: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px;"
    >
      <button id="time-play-pause">Pause</button>
      <button id="time-reverse">Reverse Direction</button>
      <select id="time-preset-select"></select>
      <input id="time-shuttle" type="range" min="-100" max="100" value="0" style="width: 150px;" />
      <span id="time-display">—</span>
    </div>
    <div
      id="scale-controls"
      style="position: fixed; top: 12px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px;"
    >
      <span>Realistic</span>
      <input id="scale-slider" type="range" min="0" max="100" value="100" style="width: 150px;" />
      <span>Explorer</span>
    </div>
    <label
      id="orbit-paths-label"
      style="position: fixed; top: 56px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="orbit-paths-toggle" type="checkbox" checked />
      Show orbit paths
    </label>
    <label
      id="body-labels-label"
      style="position: fixed; top: 100px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="body-labels-toggle" type="checkbox" checked />
      Show labels
    </label>
    <label
      id="starfield-label"
      style="position: fixed; top: 144px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="starfield-toggle" type="checkbox" checked />
      Show stars
    </label>
    <label
      id="bloom-label"
      style="position: fixed; top: 188px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="bloom-toggle" type="checkbox" checked />
      Show bloom
    </label>
    <label
      id="flares-label"
      style="position: fixed; top: 232px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="flares-toggle" type="checkbox" checked />
      Show lens flares
    </label>
    <label
      id="moons-label"
      style="position: fixed; top: 276px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="moons-toggle" type="checkbox" checked />
      Show moons
    </label>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
