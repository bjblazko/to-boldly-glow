<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To Boldly Glow</title>
  </head>
  <body>
    <div id="scene-wrapper" style="position: relative; width: 800px; height: 600px;">
      <canvas id="scene"></canvas>
      <div id="body-labels" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;"></div>
    </div>
    <button
      id="camera-mode-toggle"
      style="position: fixed; top: 12px; left: 12px; padding: 8px 12px; font: 14px sans-serif;"
    >
      Switch to Free-fly Camera
    </button>
    <div
      id="time-controls"
      style="position: fixed; bottom: 12px; left: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px;"
    >
      <button id="time-play-pause">Pause</button>
      <button id="time-reverse">Reverse Direction</button>
      <select id="time-preset-select"></select>
      <input id="time-shuttle" type="range" min="-100" max="100" value="0" style="width: 150px;" />
      <span id="time-display">—</span>
    </div>
    <div
      id="scale-controls"
      style="position: fixed; top: 12px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px;"
    >
      <span>Realistic</span>
      <input id="scale-slider" type="range" min="0" max="100" value="100" style="width: 150px;" />
      <span>Explorer</span>
    </div>
    <label
      id="orbit-paths-label"
      style="position: fixed; top: 56px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="orbit-paths-toggle" type="checkbox" checked />
      Show orbit paths
    </label>
    <label
      id="body-labels-label"
      style="position: fixed; top: 100px; right: 12px; padding: 8px 12px; font: 14px sans-serif; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer;"
    >
      <input id="body-labels-toggle" type="checkbox" checked />
      Show labels
    </label>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
